name: Publish Porcia PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Bundle barcode decoder (ZXing 0.21.3)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 90 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js' -o vendor/zxing.min.js || curl --fail --location --retry 3 --connect-timeout 20 --max-time 90 'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js' -o vendor/zxing.min.js
          test "$(wc -c < vendor/zxing.min.js)" -gt 200000
          sha256sum vendor/zxing.min.js
          # Upstream license for ZXing, stored alongside its bundled source.
          curl --fail --location --retry 2 'https://raw.githubusercontent.com/zxing-js/library/master/LICENSE' -o vendor/ZXING-LICENSE.txt || curl --fail --location --retry 2 'https://unpkg.com/@zxing/library@0.21.3/LICENSE' -o vendor/ZXING-LICENSE.txt
      - name: Upload PWA
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
