function scanFormNutrients(form){
 const result={},missing=[];
 for(const k of N.KEYS){
   const raw=String(form.elements[k]?.value??'').trim();
   if(!raw){missing.push(k);continue;}
   const val=N.num(raw);
   if(!Number.isFinite(val)||val<0||val>100000)throw Error('Некорректные значения КБЖУ');
   result[k]=val;
 }
 return {result,missing};
}
function updateScanPortion(){

}

function startCameraScanner(){

  const overlay=document.createElement('div');overlay.id='porcia-camera-overlay';
  overlay.innerHTML=`<header><h2>Сканировать штрихкод</h2><button class="close-camera" type="button" id="camera-cancel">Закрыть</button></header>

    <p class="camera-hint">Наведи заднюю камеру на полосы штрихкода и держи телефон неподвижно. Поддерживаются EAN-13 и EAN-8. Фотографировать не нужно.</p>

  const cvs=document.createElement('canvas');const ctx=cvs.getContext('2d',{willReadFrequently:true});

    e.preventDefault();const code=e.currentTarget.querySelector('input').value.trim();

        let code=null;
        if(nativeDetector){try{const detected=await nativeDetector.detect(cvs);for(const item of detected){if(PorciaEAN.check(item.rawValue)){code=item.rawValue;break;}}}catch{}}

        if(code){

          // Do not wait for a second scan: motion blur made some valid codes stall.
          status.textContent='Код считан: '+code+'. Открываю товар…';
          stop(code);
          return;
        }else{misses++;if(misses===8)status.textContent='Камера работает. Держи штрихкод крупно, горизонтально, без бликов.';}
      }
    }catch(e){status.textContent='Не удалось обработать изображение камеры: '+(e.message||e);status.classList.add('camera-error');return;}

      const usingZXing=startZXing();

      quietTimer=setTimeout(()=>{

      },9000);
    }catch(e){
      if(closed)return;
      const reason=String(e?.name||'')+' '+String(e?.message||e);

      status.classList.add('camera-error');
    }

function historyView(){const today=N.dateKey(),from=N.shiftDate(today,-6),st=N.stats(state,from,today),dates=[...new Set([...state.entries.map(e=>e.date),...Object.keys(state.days)])].sort().reverse(),week=Array.from({length:7},(_,i)=>N.shiftDate(from,i)),max=Math.max(state.goals.kcal,...week.map(d=>N.total(dayEntries(d)).kcal));return `<div class="title-row"><div><h1>Твоя история</h1><p class="subtitle">Последние 7 дней · ${st.count} полностью заполненных</p></div></div><div class="stats-grid">${[['kcal','Ккал в среднем'],['protein','Белки, г в среднем'],['fat','Жиры, г в среднем']].map(([k,l])=>`<div class="stat"><strong>${st.count?fmt(st.average[k]):'—'}</strong><span>${l}</span></div>`).join('')}</div><div class="small-card"><h3>Записанные калории</h3><div class="week-chart">${week.map(d=>{const e=dayEntries(d),t=N.total(e),full=dayInfo(d).complete;return `<div class="chart-col"><span>${e.length?fmt(t.kcal):'—'}</span><div class="chart-bar ${full?'':'partial'}" style="height:${e.length?Math.max(2,t.kcal/max*95):2}px" title="${dateLong(d)}: ${e.length?t.kcal+' ккал':'нет записей'}"></div><span>${d.slice(8)}.${d.slice(5,7)}</span></div>`;}).join('')}</div><p class="micro">Штриховка — неполный день. Пропуски не считаются нулевым питанием.</p></div><div class="section-head"><h2>Все записи</h2></div><div class="history-list">${dates.map(d=>{const e=dayEntries(d),t=N.total(e);return `<button class="history-row" data-action="open-day" data-date="${d}"><div><strong>${dateLong(d)}</strong><span>${dayInfo(d).complete?'Вся еда записана':'Неполный день'}${e.some(x=>x.estimated)?' · есть оценки':''}</span></div><div class="right"><strong>${e.length?fmt(t.kcal)+' ккал':'Только вода'}</strong><span>Б ${fmt(t.protein)} · Ж ${fmt(t.fat)} · У ${fmt(t.carbs)}</span></div></button>`;}).join('')||'<div class="empty">История появится после первой записи.</div>'}</div>`;}

function normalizeDish(s){return String(s||'').toLocaleLowerCase('ru').normalize('NFKC').replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/gi,' ').trim();}
function dishWords(s){return normalizeDish(s).split(/\s+/).filter(w=>w.length>=3&&!['для','без','или','под','как','with','мой','моя','мое','мои'].includes(w));}
function dishSimilarity(search,title){
 const q=normalizeDish(search),t=normalizeDish(title);if(!q||!t)return 0;
 if(q===t)return 100;
 if(t.includes(q))return 80+Math.min(10,q.length/3);
 const a=dishWords(q),b=dishWords(t);
 if(!a.length||!b.length)return 0;
 let hit=0;for(const w of a)if(b.some(x=>x===w||(Math.min(x.length,w.length)>=5&&x.slice(0,5)===w.slice(0,5))))hit++;
 return hit===0?0:Math.round(15+55*hit/a.length-15*Math.max(0,b.length-a.length)/Math.max(1,b.length));
}
function rankedDishLocal(term){
 const refs=[...VERIFIED_RU_RECIPES,...DISH_REFERENCE].map((f,i)=>({...f,idx:i,source:'reference'}));
 const own=[...state.foods,...state.recipes].map(f=>({...f,source:'saved'}));
 return [...own,...refs].map(f=>({f,score:Math.max(...[f.name,...(f.aliases||[])].map(n=>dishSimilarity(term,n)))}))
 .filter(x=>x.score>=45).sort((a,b)=>b.score-a.score||Number(a.f.source!=='saved')-Number(b.f.source!=='saved')).slice(0,12).map(x=>x.f);

function dishApply(f,source){
 const form=$('#entry-form');if(!form||!f)return;
 // Never convert the lookup result as if it were the user's old manual values.
 editMode='hundred';dishChosenName=f.name;clearTimeout(dishDebounceTimer);dishSearchSerial++;form.elements.name.value=f.name;
 for(const k of N.KEYS)form.elements[k].value=f[k];
 if(!form.elements.grams.value.trim()||N.num(form.elements.grams.value)<=0)form.elements.grams.value='100';
 form.elements.estimated.checked=source==='reference'||Boolean(f.estimated);
 const origin=source==='reference'?(f.url?'Пример из Food.ru, расчёт на 100 г сырых ингредиентов: '+f.url:'Ориентировочное КБЖУ типичного домашнего блюда; состав неизвестен'):source==='online'?('Open Food Facts · '+(f.brand||'')+' · '+(f.code||'')):(f.note||'Моя база');
 form.elements.note.value=origin.slice(0,3000);
 updatePortion();
 $('#dish-online-results').innerHTML='<div class="dish-selected">✓ Подставлены значения на 100 г. Проверь массу, КБЖУ и нажми «Добавить в дневник».</div>';
 $('#dish-suggestions').innerHTML='';
}
async function dishSearch(button){
 const form=$('#entry-form');if(!form)return;
 const term=form.elements.name.value.trim(),dest=$('#dish-online-results');
 if(term.length<3){dest.innerHTML='<p class="error">Введи название блюда (минимум 3 буквы).</p>';return;}
 const serial=++dishSearchSerial;showDishSuggestions();
 const previous=button?button.disabled:false;if(button)button.disabled=true;
 dest.innerHTML='<p class="micro">Проверяю интернет-каталог Open Food Facts…</p>';
 try{
  const list=await porciaCall('searchFoods',{term});
  if(serial!==dishSearchSerial||!$('#entry-form'))return;
  const rank=list.map(f=>({...f,score:dishSimilarity(term,f.name)})).filter(f=>f.score>=37).sort((a,b)=>b.score-a.score||Number(b.russian)-Number(a.russian));
  dishOnlineFoods=rank.slice(0,10);
  dest.innerHTML=dishOnlineFoods.length?`<div class="micro dish-list-title">Интернет · данные готовых продуктов на 100 г</div>${dishOnlineFoods.map((f,i)=>dishPickButton(f,'online',i)).join('')}<p class="micro" style="margin-top:8px">Данные из Open Food Facts внесены пользователями. Для домашнего рецепта значения могут отличаться.</p>`:'<p class="micro">Совпадений среди упаковок с полными КБЖУ нет. Посмотри варианты российских рецептов выше или введи КБЖУ вручную.</p>';
 }catch(ex){if(serial===dishSearchSerial&&$('#entry-form'))dest.innerHTML='<p class="micro">Интернет-каталог не ответил: '+esc(ex.message)+'. Можно выбрать справочную оценку выше или заполнить КБЖУ вручную.</p>';}
 finally{if(button&&button.isConnected)button.disabled=previous;}
}

if(form.id==='food-form'){const barcode=String(form.elements.barcode.value||'').trim();if(barcode&&(!/^\d{8}$|^\d{12,14}$/.test(barcode)||!PorciaEAN.check(barcode)))throw Error('Штрихкод содержит ошибку. Проверь цифры под полосками.');const f={id:form.dataset.id||N.uid(),name:form.elements.name.value.trim(),barcode,...parseValues(form),note:form.elements.note.value.trim(),estimated:form.elements.estimated.checked};if(!f.name)throw Error('Укажи название');next.foods=next.foods.filter(x=>x.id!==f.id);next.foods.push(f);if(await commit(next)){closeDialog();notify('Продукт сохранён');}return;}
if(form.id==='recipe-form'){const y=N.num(form.elements.yieldGrams.value),r={id:form.dataset.id||N.uid(),name:form.elements.name.value.trim(),...N.recipeValue(recipeItems,y),items:clone(recipeItems),yieldGrams:y,note:form.elements.note.value.trim(),estimated:form.elements.estimated.checked||recipeItems.some(i=>i.estimated)};if(!r.name)throw Error('Укажи название');next.recipes=next.recipes.filter(x=>x.id!==r.id);next.recipes.push(r);if(await commit(next)){closeDialog();notify('Рецепт сохранён');}return;}}catch(ex){if(form.querySelector('.error'))err(form,ex.message);else notify(ex.message);}});
document.addEventListener('click',async e=>{const mode=e.target.closest('[data-mode]');if(mode){const target=mode.dataset.mode,form=$('#entry-form'),g=N.num(form.elements.grams.value);if(target!==editMode&&Number.isFinite(g)&&g>0){try{const v=parseValues(form);for(const k of N.KEYS)form.elements[k].value=Number((v[k]*(target==='hundred'?100/g:g/100)).toFixed(3));}catch{}}editMode=target;updatePortion();return;}if(e.target.id==='remove-photo'){photo=null;$('#photo-preview').hidden=true;$('#remove-photo').hidden=true;return;}const b=e.target.closest('[data-action]');if(!b||busy)return;const a=b.dataset.action,id=b.dataset.id;switch(a){
case'stats-range':statsRange=Number(b.dataset.value)||7;render();break;

case'delete-weight':{if(!await porciaCall('confirm',{message:'Удалить измерение веса за '+dateLong(b.dataset.date)+'?'}))break;
 const next=clone(state);next.weights=(next.weights||[]).filter(w=>w.date!==b.dataset.date);if(await commit(next)){closeDialog();notify('Измерение удалено');}break;}
case'dish-search':await dishSearch(b);break;
case'dish-pick':{const source=b.dataset.source,i=Number(b.dataset.index);const f=source==='online'?dishOnlineFoods[i]:localDishHits[i];if(f)dishApply(f,source);break;}
case'barcode-scan':await scanBarcode(b);break;
case'scan-preview':if(pendingScanFood)openScanReview(pendingScanFood);else notify('Отсканируй товар ещё раз');break;
case'cancel-scan':closeDialog();break;
case'scan-correct':closeDialog();openFood(null,lastBarcode);break;

case'new-food-from-barcode':openFood(null,lastBarcode);break;

case'online-search':{const term=String($('#online-search')?.value||'').trim();if(term.length<2){notify('Введи хотя бы 2 буквы');break;}const target=$('#online-results');target.innerHTML='<p class="note">Ищу продукты в Open Food Facts…</p>';b.disabled=true;try{remoteFoods=await porciaCall('searchFoods',{term});if($('#online-results'))$('#online-results').innerHTML=onlineCards(remoteFoods);}catch(ex){if($('#online-results'))$('#online-results').innerHTML='<p class="error">'+esc('Не удалось загрузить базу: '+ex.message)+'</p>';}finally{b.disabled=false;}break;}
case'online-use':{const f=remoteFoods[Number(b.dataset.index)];if(f){openEntry(null,{...f,id:'online-'+f.code,note:'Open Food Facts · '+(f.brand||'')},null);}break;}
case'online-save':{const f=remoteFoods[Number(b.dataset.index)];if(f){const next=clone(state);if(!next.foods.some(x=>x.barcode===f.code)){next.foods.push({id:N.uid(),name:f.name,barcode:f.code,kcal:f.kcal,protein:f.protein,fat:f.fat,carbs:f.carbs,estimated:false,note:'Open Food Facts · '+f.code});if(await commit(next))notify('Продукт сохранён в личной базе');}else notify('Этот штрихкод уже есть среди твоих продуктов');}break;}
case'native-import':{try{const imported=await porciaCall('import');if(!imported)break;N.validate(imported);if(!await porciaCall('confirm',{message:`Восстановить ${imported.entries.length} записей из копии? Текущий дневник будет заменён.`}))break;if(await commit(imported))notify('Дневник восстановлен');}catch(ex){notify('Не удалось восстановить: '+ex.message);}break;}
case'native-photo':{const form=$('#entry-form'),submit=form.querySelector('[type=submit]');submit.disabled=true;b.disabled=true;try{const result=await porciaCall('photo');if(result&&$('#entry-form')===form){photo=result;$('#photo-preview').src=result;$('#photo-preview').hidden=false;$('#remove-photo').hidden=false;}}catch(ex){err(form,'Не удалось открыть фото: '+ex.message);}finally{submit.disabled=false;b.disabled=false;}break;}
case'prev':currentDate=N.shiftDate(currentDate,-1);render();break;case'next':currentDate=N.shiftDate(currentDate,1);render();break;case'today':currentDate=N.dateKey();render();break;case'add':openEntry(null,null,b.dataset.meal);break;case'edit-entry':openEntry(id);break;case'new-food':openFood();break;case'edit-food':openFood(id);break;case'use-food':openEntry(null,state.foods.find(x=>x.id===id));break;case'use-recipe':openEntry(null,state.recipes.find(x=>x.id===id));break;case'new-recipe':openRecipe();break;case'edit-recipe':openRecipe(id);break;case'add-ingredient':{const f=state.foods.find(x=>x.id===$('#recipe-food').value),g=N.num($('#ingredient-grams').value);if(!f||!Number.isFinite(g)||g<=0||g>10000){err($('#recipe-form'),'Выбери продукт и массу от 0 до 10 000 г');break;}recipeItems.push({...clone(f),grams:g});$('#ingredient-grams').value='';$('#recipe-form .error').textContent='';renderIngredients();break;}case'remove-ingredient':recipeItems.splice(Number(b.dataset.index),1);renderIngredients();break;case'delete-entry':case'delete-food':case'delete-recipe':{if(!await porciaCall('confirm',{message:'Удалить эту запись?'}))break;const next=clone(state),key=a==='delete-entry'?'entries':a==='delete-food'?'foods':'recipes',old=next[key].find(x=>x.id===id);next[key]=next[key].filter(x=>x.id!==id);if(key==='entries'&&next.days[old.date])next.days[old.date].complete=false;if(await commit(next)){closeDialog();notify('Удалено');}break;}case'water':{const next=clone(state);next.days[currentDate]={...dayInfo(),water:Math.min(20000,Math.max(0,dayInfo().water+Number(b.dataset.amount)))};await commit(next);break;}case'open-day':currentDate=b.dataset.date;location.hash='diary';render();break;case'export':exportBackup();break;case'report':shareReport();break;case'copy-report':try{await porciaCall('copy',{text:$('#report-text').value});notify('Отчёт скопирован');}catch{$('#report-text').focus();$('#report-text').select();notify('Выдели текст и нажми «Копировать».');}break;case'save-report':download('nutrition-'+currentDate+'.txt',$('#report-text').value,'text/plain;charset=utf-8');break;}});
